<!DOCTYPE html>
<html lang="KO">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diagram</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/slick.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/slick.min.js"></script> -->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
    <script src="../js/custom.js"></script>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
    }

    .container {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 20px;
        box-sizing: border-box;
    }

    h1 {
        margin: 40px 0 20px;
        font-size: 32px;
        text-align: center;
    }

    .slider {
        /* optional: background or margin 설정 가능 */
    }

    .slider .slide {
        /* variable width 스타일이면 width 지정 안해도 됨 */
        width: 400px;
        margin-right: 30px;
    }

    .slider .slide img {
        display: block;
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    .progress {
        position: relative;
        width: 100%;
        height: 4px;
        background: #ddd;
        margin: 30px 0;
        border-radius: 2px;
        overflow: hidden;
    }

    .progress-bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 0%;
        height: 100%;
        background: #000;
        transition: width 0.4s ease-in-out;
    }
</style>

<div class="container">
    <h1>Slick Slider + Progress Bar</h1>
    <div class="slider">
        <div class="slide"><img src="https://picsum.photos/400/250?1" alt="" /></div>
        <div class="slide"><img src="https://picsum.photos/400/250?2" alt="" /></div>
        <div class="slide"><img src="https://picsum.photos/400/250?3" alt="" /></div>
        <div class="slide"><img src="https://picsum.photos/400/250?4" alt="" /></div>
    </div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>
</div>

<script>
    $(document).ready(function () {
        var $slider = $('.slider');
        var $progressBar = $('.progress-bar');

        $slider.on('init reInit afterChange', function (event, slick, currentSlide) {
            var i = (currentSlide ? currentSlide : 0) + 1;
            var percent = (i / slick.slideCount) * 100;
            $progressBar.css('width', percent + '%');
        });

        $slider.slick({
            slidesToShow: 1,
            variableWidth: true,
            autoplay: true,
            autoplaySpeed: 3000,
            arrows: true,
            pauseOnHover: false,
            pauseOnFocus: false
        });
    });
</script>
</body>

</html>
