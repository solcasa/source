<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Tab Menu + Active Example</title>

    <!DOCTYPE html>
    <html lang="ko">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fixed Tab Menu + Rounded + Active</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: sans-serif;
            }

            /* header */
            .header {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.5);
                color: #fff;
                padding: 20px;
                z-index: 10;
            }

            /* 서브탑배너 */
            .sub_top_banner {
                height: 400px;
                background: url(../images/main_vi.jpg) no-repeat center/center/cover;
                position: relative;
            }

            /* 탭메뉴 */
            .tab_menu {
                position: absolute;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                max-width: 1200px;
                width: 90%;
                background: tomato;
                border-radius: 50px;
                z-index: 9;
                transition: all 0.3s ease;
                padding: 5px 0;
                display: flex;
                justify-content: center;
            }

            /* fixed 전환 시 */
            .tab_menu.fixed {
                position: fixed;
                top: 10px;
                bottom: auto;
                left: 50%;
                transform: translateX(-50%);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }

            /* 탭 ul */
            .tab_menu ul {
                display: flex;
                justify-content: center;
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .tab_menu ul li a {
                display: block;
                padding: 10px 30px;
                text-decoration: none;
                color: #fff;
                font-weight: bold;
                background: transparent;
                border-radius: 50px;
                transition: all 0.3s ease;
            }

            /* 활성화 메뉴 */
            .tab_menu ul li a.active {
                background: #000;
            }

            /* content */
            .content {
                /* padding-top: 80px; */
                /* fixed 메뉴 높이 확보 */
            }

            /* footer */
            .footer {
                background: #222;
                color: #fff;
                text-align: center;
                padding: 30px;
            }
        </style>
    </head>

<body>

    <header class="header">Header</header>

    <div class="sub_top_banner">
        서브탑배너222

        <nav class="tab_menu">
            <ul>
                <li><a href="./tapmenu_fixed.html">메뉴1</a></li>
                <li><a href="./tapmenu_fixed2.html">메뉴2</a></li>
                <li><a href="https://www.naver.com/" target="_blank">메뉴3</a></li>
            </ul>
        </nav>
    </div>

    <section class="content">
        <div style="height:2000px;background:#f5f5f5;">콘텐츠 영역</div>
    </section>

    <footer class="footer">푸터</footer>
    <script>
        const tabMenu = document.querySelector('.tab_menu');
        const banner = document.querySelector('.sub_top_banner');
        const menuLinks = document.querySelectorAll('.tab_menu ul li a');

        // 배너 bottom 기준
        const bannerBottom = banner.offsetTop + banner.offsetHeight - 10;

        window.addEventListener('scroll', () => {
            if (window.scrollY >= bannerBottom) {
                tabMenu.classList.add('fixed');
            } else {
                tabMenu.classList.remove('fixed');
            }
        });

        // 현재 페이지 주소와 메뉴 링크 비교해 active 적용
        const currentPath = location.pathname.split('/').pop();
        menuLinks.forEach(link => {
            const linkPath = link.getAttribute('href').split('/').pop();
            if (linkPath === currentPath) {
                link.classList.add('active');
            }
        });

        // 메뉴 클릭 시 active(같은 페이지 내에서 탭처럼 쓰고 싶을 때)
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                menuLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });
    </script>



</body>

</html>
